name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check src tests

      - name: Run unit tests
        run: python -m pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest

    needs: test

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: financial_data_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
        

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: financial_data_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d financial_data_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: python -m pytest -m integration

  docker:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t krzysiekgdansk1985/financial-data-pipeline:latest \
            -t krzysiekgdansk1985/financial-data-pipeline:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push krzysiekgdansk1985/financial-data-pipeline:latest
          docker push krzysiekgdansk1985/financial-data-pipeline:${{ github.sha }}